{% extends "profile/profile_base.html" %}
{% load static %}
{% block title %}
    {{ block.super }}
    ویرایش اطلاعات شخصی
{% endblock %}
{% block head %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static "css/edit_personal_info.css" %}">
{% endblock %}
{% block profile_content %}
    <!-- فرم ویرایش اطلاعات کاربر -->
    <div class="user-edit-wrapper">
        <form id="userEditForm" class="user-edit-form" enctype="multipart/form-data" method="post">
            {% csrf_token %}
            <!-- تصویر پروفایل -->
            <div class="form-group avatar-group">
                <label for="avatar" class="avatar-preview" id="avatarPreview">
                    {% if user.image %}
                        <img src="{{ user.image.url }}" alt="تصویر پروفایل">
                    {% else %}
                        <span class="avatar-placeholder">+</span>
                    {% endif %}

                </label>
                <label for="avatar" class="avatar-label">انتخاب تصویر</label>
                <input type="file" id="avatar" name="image" accept="image/*">
            </div>

            <!-- فیلدهای ورودی -->
            <div class="form-group half">
                <label for="firstName">نام</label>
                <input type="text" id="firstName" name="first_name" placeholder="نام" value="{{ user.first_name|default:"" }}">
            </div>

            <div class="form-group half">
                <label for="lastName">نام خانوادگی</label>
                <input type="text" id="lastName" name="last_name" placeholder="نام خانوادگی" value="{{ user.last_name|default:"" }}">
            </div>

            <div class="form-group half">
                <label for="email">ایمیل</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" value="{{ user.email|default:"" }}">
            </div>

            <div class="form-group half">
                <label for="job">شغل</label>
                <input type="text" id="job" name="job" placeholder="شغل شما" value="{{ user.job|default:"" }}">
            </div>

            <div class="form-group">
                <label for="bio">بیوگرافی</label>
                <textarea id="bio" name="bio" placeholder="چند جمله درباره خودتان..." rows="4">{{ user.bio|default:"" }}</textarea>
            </div>

            <div class="form-group submit-group">
                <button type="submit">ذخیره تغییرات</button>
            </div>
        </form>
    </div>

    <script>
        // فقط مدیریت ظاهری و پیش‌نمایش تصویر
        const avatarInput = document.getElementById('avatar');
        const avatarPreview = document.getElementById('avatarPreview');

        avatarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) {
                avatarPreview.innerHTML = '<span class="avatar-placeholder">+</span>';
                return;
            }
            const reader = new FileReader();
            reader.onload = (event) => {
                avatarPreview.innerHTML = `<img src="${event.target.result}" alt="تصویر پروفایل">`;
            };
            reader.readAsDataURL(file);
        });
    </script>
{% endblock %}
