{% extends "base/base.html" %}
{% load jformat %}
{% block sub_content %}
	<table>
        <thead>
            <tr>
                <th colspan="3">مقالات شما</th>
                <th>تاریخ ایجاد</th>
                <th>ویرایش</th>
            </tr>
        </thead>
        <tbody>
            {% for post in user.bloger.posts.all %}
                <tr>
                    <td><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></td>
                    <td>{{ post.create|jformat:"%Y/%d/%m" }}</td>
                    <td><a href="{% url "blog:edit_post" post.id %}">ویرایش</a></td>
                </tr>
            {% endfor %}
        </tbody>

    </table>
{% endblock %}
